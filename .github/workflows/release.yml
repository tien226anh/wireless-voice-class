name: Versioned release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: 'suggest = version only (no build); release = build and publish'
        type: choice
        options: [suggest, release]
        default: suggest
      version:
        description: 'For release: exact new tag, for example v0.5.1'
        type: string
        required: false
      bump:
        description: Version suggestion after the latest release
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

# Serialize version validation and publication; preserve queued release requests.
concurrency:
  group: versioned-release-main
  queue: max

jobs:
  prepare:
    name: Validate release or suggest version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      # GitHub exposes draft releases only to callers with push access.
      # The planning script uses GET requests only.
      contents: write
      pull-requests: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v9
        id: plan
        with:
          retries: 3
          script: |
            const { pathToFileURL } = require('node:url');
            const moduleUrl = pathToFileURL(process.env.GITHUB_WORKSPACE + '/scripts/release-policy.mjs');
            const { prepareRelease, packageVersion } = await import(moduleUrl.href);
            const plan = await prepareRelease({
              api: async (method, path, data) => (await github.request(method + ' ' + path, data)).data,
              repo: context.repo.owner + '/' + context.repo.repo,
              eventName: context.eventName,
              event: context.payload,
              sha: context.sha,
              ref: context.ref,
              actor: process.env.GITHUB_TRIGGERING_ACTOR || context.actor,
              baseline: packageVersion(),
            });
            core.setOutput('run', String(plan.run));
            core.setOutput('tag', plan.tag || '');
            core.notice(plan.reason);
            await core.summary.addHeading('Release plan').addRaw(plan.reason).write();

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      BUILD_TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Stamp the chosen release version
        run: node scripts/release.mjs stamp --version "$RELEASE_TAG"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libasound2-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable "$BUILD_TARGET"
      - name: Build release
        run: cargo +stable build --locked --release --target "$BUILD_TARGET"
      - name: Package Linux release
        if: runner.os == 'Linux'
        run: |
          mkdir -p package/assets dist
          cp "target/$BUILD_TARGET/release/wireless-pa" LICENSE README.md VERSION.txt package/
          cp -r docs package/
          cp assets/logo.svg package/assets/
          cp -r assets/icons package/assets/
          cp packaging/linux/wireless-pa.desktop package/
          tar -czf "dist/wireless-pa-${RELEASE_TAG}-linux-x64.tar.gz" -C package wireless-pa LICENSE README.md VERSION.txt docs assets wireless-pa.desktop
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package, dist | Out-Null
          Copy-Item "target/$env:BUILD_TARGET/release/wireless-pa.exe", LICENSE, README.md, VERSION.txt package/
          Copy-Item docs package/ -Recurse
          New-Item -ItemType Directory -Force package/assets | Out-Null
          Copy-Item assets/logo.svg package/assets/
          Copy-Item assets/icons package/assets/ -Recurse
          Compress-Archive -Path package/* -DestinationPath "dist/wireless-pa-${env:RELEASE_TAG}-windows-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish tagged GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish archives and checksums
        run: node scripts/release.mjs publish --version "$RELEASE_TAG"
