name: Release approved pull request

on:
  push:
    branches: [main]
  # PR builds validate both downloadable archives before review and merge.
  pull_request:
    branches: [main]
  # Manual runs verify both builds without publishing a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  approval:
    name: Check merged pull request approval
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approved: ${{ steps.review.outputs.approved }}
      pr: ${{ steps.review.outputs.pr }}
    steps:
      - uses: actions/github-script@v9
        id: review
        with:
          retries: 3
          script: |
            core.setOutput('approved', 'false');
            const pulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { ...context.repo, commit_sha: context.sha, per_page: 100 }
            );
            const pr = pulls.find(p =>
              p.merged_at && p.base.ref === 'main' &&
              p.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              p.merge_commit_sha === context.sha
            );
            if (!pr) {
              core.notice('No merged pull request for this commit; skipping release.');
              return;
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              ...context.repo, pull_number: pr.number, per_page: 100
            });
            const latest = new Map();
            for (const review of reviews) {
              if (!review.user || !review.submitted_at ||
                  review.submitted_at > pr.merged_at ||
                  !['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) {
                continue;
              }
              latest.set(review.user.id, review);
            }
            const decisions = [...latest.values()];
            const approved = decisions.some(r =>
              r.state === 'APPROVED' && r.commit_id === pr.head.sha
            ) && !decisions.some(r => r.state === 'CHANGES_REQUESTED');
            core.setOutput('approved', String(approved));
            core.setOutput('pr', String(pr.number));
            if (!approved) {
              core.notice('The final PR revision needs approval with no outstanding change requests; skipping release.');
            }

  build:
    name: Build ${{ matrix.platform }}
    needs: approval
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || needs.approval.outputs.approved == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libasound2-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable "$BUILD_TARGET"
      - name: Build release
        run: cargo +stable build --locked --release --target "$BUILD_TARGET"
      - name: Package Linux release
        if: runner.os == 'Linux'
        run: |
          mkdir -p package dist
          cp "target/$BUILD_TARGET/release/wireless-pa" LICENSE README.md package/
          cp -r docs package/
          tar -czf dist/wireless-pa-linux-x64.tar.gz -C package wireless-pa LICENSE README.md docs
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package, dist | Out-Null
          Copy-Item "target/$env:BUILD_TARGET/release/wireless-pa.exe", LICENSE, README.md package/
          Copy-Item docs package/ -Recurse
          Compress-Archive -Path package/* -DestinationPath dist/wireless-pa-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [approval, build]
    if: github.event_name == 'push' && needs.approval.outputs.approved == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ needs.approval.outputs.pr }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Read application version
        id: version
        shell: bash
        run: |
          cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json, sys; data = json.load(sys.stdin); package = next(p for p in data["packages"] if p["id"] in data["workspace_members"]); print("version=" + package["version"])' >> "$GITHUB_OUTPUT"
      - name: Publish archives and checksums
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${APP_VERSION}-pr.${PR_NUMBER}"
          cd dist
          test -s wireless-pa-linux-x64.tar.gz
          test -s wireless-pa-windows-x64.zip
          sha256sum wireless-pa-linux-x64.tar.gz wireless-pa-windows-x64.zip > SHA256SUMS
          if gh release view "$tag" --json isDraft > release.json; then
            if [ "$(python3 -c 'import json; print(json.load(open("release.json"))["isDraft"])')" = "False" ]; then
              echo "Release $tag is already published."
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft \
              --title "Wireless PA ${APP_VERSION} (PR #${PR_NUMBER})" --generate-notes
          fi
          gh release upload "$tag" wireless-pa-linux-x64.tar.gz wireless-pa-windows-x64.zip SHA256SUMS --clobber
          gh release edit "$tag" --draft=false
